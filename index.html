<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Central de Chamados Operacionais</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--roxo:#7C3AED;--roxo-light:#A78BFA;--roxo-dark:#5B21B6;--amber:#F59E0B;--teal:#0D9488;--teal-light:#2DD4BF;--bg:#0F0D1A;--card:#1A1730;--card2:#221E38;--input:#2A2545;--line:#3D3660;--ink:#F8F7FF;--mute:#9B96C0;--dim:#6B6490;--ok:#10B981;--bad:#EF4444;--r:12px}
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;min-height:100vh}
header{background:linear-gradient(135deg,#1A1730 0%,#0F0D1A 100%);border-bottom:1px solid var(--line);padding:0 32px;min-height:64px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;position:sticky;top:0;z-index:30}
.brand{font-size:19px;font-weight:800;background:linear-gradient(90deg,var(--roxo-light),var(--teal-light));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
.env{background:var(--amber);color:#000;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{background:transparent;border:0;color:var(--mute);padding:8px 16px;border-radius:8px;cursor:pointer;font:500 14px 'Inter',sans-serif;transition:all .2s;display:inline-flex;align-items:center;gap:7px}
.tabs button:hover{background:var(--card2);color:var(--ink)}
.tabs button.on{background:linear-gradient(135deg,var(--roxo-dark),var(--roxo));color:#fff}
.cnt{background:var(--amber);color:#000;font-size:11px;font-weight:700;padding:1px 7px;border-radius:10px}
.cnt:empty{display:none}
main{padding:24px 24px 40px;max-width:1600px;margin:0 auto}
.sub-tabs{display:flex;gap:6px;margin-bottom:12px}
.sub-tabs button{font:600 13px 'Inter',sans-serif;background:var(--card);border:1px solid var(--line);color:var(--mute);padding:8px 16px;border-radius:8px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.sub-tabs button.on{border-color:var(--roxo-light);color:var(--ink);background:var(--card2)}
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;background:var(--card);padding:16px;border-radius:var(--r);border:1px solid var(--line);margin-bottom:14px}
.f{display:flex;flex-direction:column;gap:6px}
.f label{font-size:11px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
input,select,textarea{font:14px 'Inter',sans-serif;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--input);color:var(--ink);outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--roxo-light);box-shadow:0 0 0 3px rgba(124,58,237,.15)}
input[type=date]{color-scheme:dark}
select option{background:var(--card2)}
select:disabled{opacity:.5}
::placeholder{color:var(--dim)}
.invalid{border-color:var(--bad)!important;background:rgba(239,68,68,.08)!important}
textarea{resize:vertical;min-height:70px}
.btn{font:600 13px 'Inter',sans-serif;padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--mute);cursor:pointer;white-space:nowrap;transition:all .2s}
.btn:hover{border-color:var(--roxo-light);color:var(--ink)}
.btn.pri{background:linear-gradient(135deg,var(--roxo),var(--roxo-dark));border-color:transparent;color:#fff}
.btn.pri:hover{filter:brightness(1.15)}
.btn.teal{background:linear-gradient(135deg,var(--teal),#0F766E);border-color:transparent;color:#fff}
.btn.danger{background:transparent;color:var(--bad);border-color:rgba(239,68,68,.4)}
.btn.danger:hover{background:rgba(239,68,68,.1)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.spacer{flex:1}
.count{color:var(--mute);font-size:12px;margin:0 2px 8px}
.tablewrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:auto}
table{width:100%;border-collapse:collapse;min-width:1000px;font-size:13px}
.nw{white-space:nowrap}
th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--mute);padding:12px 10px;border-bottom:1px solid var(--line);background:var(--card2);letter-spacing:.05em}
td{padding:10px 10px;border-bottom:1px solid rgba(61,54,96,.5);vertical-align:top}
tbody tr{cursor:pointer;transition:background .15s}
tbody tr:hover{background:var(--card2)}
tbody tr.urg{background:rgba(239,68,68,.07)}
tbody tr.urg:hover{background:rgba(239,68,68,.13)}
tbody tr.urg td:first-child{box-shadow:inset 4px 0 0 var(--bad)}
.urgtag{display:inline-block;background:var(--bad);color:#fff;font:800 10px 'Inter',sans-serif;letter-spacing:.08em;padding:3px 8px;border-radius:4px;vertical-align:middle}
td .urgtag{margin-top:5px}
.sub{color:var(--mute);font-size:12px;margin-top:2px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
td .mono b{color:var(--roxo-light)}
.empty{text-align:center;color:var(--mute);padding:40px!important;cursor:default}
.st{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.st-aberto{background:rgba(59,130,246,.15);color:#93C5FD;border-color:rgba(59,130,246,.4)}
.st-andamento{background:rgba(124,58,237,.18);color:var(--roxo-light);border-color:rgba(124,58,237,.45)}
.st-aguardando{background:rgba(155,150,192,.1);color:var(--mute);border:1px dashed var(--dim)}
.st-devolvido{background:rgba(13,148,136,.15);color:var(--teal-light);border-color:rgba(13,148,136,.45)}
.st-finalizado{background:rgba(100,100,120,.2);color:#C7C3E0;border-color:rgba(100,100,120,.4)}
.st-cancelado{background:transparent;color:var(--dim);border-color:rgba(100,100,120,.3);text-decoration:line-through}
.sla{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.sla i{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.sla-ok{background:rgba(16,185,129,.12);color:#6EE7B7;border-color:rgba(16,185,129,.4)}.sla-ok i{background:var(--ok)}
.sla-warn{background:rgba(245,158,11,.12);color:#FCD34D;border-color:rgba(245,158,11,.45)}.sla-warn i{background:var(--amber)}
.sla-late{background:rgba(239,68,68,.12);color:#FCA5A5;border-color:rgba(239,68,68,.45)}.sla-late i{background:var(--bad)}
.sla-pause{background:transparent;color:var(--mute);border:1px dashed var(--dim)}
.sla-end{background:rgba(100,100,120,.15);color:#C7C3E0;border-color:rgba(100,100,120,.35)}
.sla-endbad{background:rgba(100,100,120,.15);color:#FCA5A5;border-color:rgba(239,68,68,.3)}
.sla-x{color:var(--dim)}
.setor{display:inline-block;font-size:12px;font-weight:600;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:2px 8px;white-space:nowrap}
.more{display:block;margin:14px auto}
.cp{border:0;background:none;cursor:pointer;color:var(--dim);font-size:12px;padding:2px 4px;border-radius:4px;transition:all .15s}
.cp:hover{color:var(--roxo-light);background:rgba(124,58,237,.1)}
/* drawer */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:40}
.overlay.show{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--card);border-left:1px solid var(--line);z-index:50;transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.5)}
.drawer.show{transform:none}
.dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:var(--card2)}
.dh #dTitle{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.x{margin-left:auto;border:0;background:none;font-size:24px;cursor:pointer;color:var(--mute);line-height:1}
.x:hover{color:var(--ink)}
.db{overflow:auto;padding:18px 20px;flex:1}
.info{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;margin-bottom:16px}
.info .k{font-size:11px;color:var(--mute);text-transform:uppercase;font-weight:600;letter-spacing:.05em}
.info .v{margin-top:3px;word-break:break-word}
.full{grid-column:1/-1}
.obs{background:var(--input);border:1px solid var(--line);border-radius:8px;padding:10px 12px;white-space:pre-wrap}
.warn{color:var(--amber);font-size:12px}
.acts{display:flex;gap:8px;flex-wrap:wrap;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:16px}
.acts:empty{display:none}
h4{margin:0 0 10px;font-size:11px;text-transform:uppercase;color:var(--mute);letter-spacing:.05em}
.ev{text-align:center;margin:12px 0;font-size:12px;color:var(--dim)}
.ev span{background:var(--card2);border:1px solid var(--line);padding:3px 10px;border-radius:99px;color:var(--ink);font-weight:600;display:inline-block}
.ev small{display:block;margin-top:4px}
.msg{max-width:85%;margin:8px 0;padding:9px 12px;border-radius:10px;border:1px solid var(--line)}
.msg.sol{background:rgba(124,58,237,.12);border-color:rgba(124,58,237,.35)}
.msg.set{background:rgba(13,148,136,.12);border-color:rgba(13,148,136,.35);margin-left:auto}
.mh{font-size:12px;margin-bottom:4px}
.mh .tm{color:var(--mute)}
.mh small{color:var(--dim);margin-left:4px}
.mb{white-space:pre-wrap;word-break:break-word}
.composer{border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:8px;align-items:flex-end;background:var(--card2);flex-wrap:wrap}
.composer textarea{flex:1;min-height:56px;min-width:200px}
.composer select{width:170px}
.btn.clip{padding:9px 12px;font-size:15px}
.anexos{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.anx{display:flex;align-items:center;gap:12px;background:var(--input);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.anx .ic{font-size:10px;font-weight:800;padding:6px 7px;border-radius:6px;background:rgba(239,68,68,.15);color:#FCA5A5;border:1px solid rgba(239,68,68,.35)}
.anx .ic.img{background:rgba(13,148,136,.15);color:var(--teal-light);border-color:rgba(13,148,136,.4)}
.anx-i{flex:1;min-width:0}
.anx-n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* modais */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal.show{display:flex}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;width:min(480px,100%);max-height:92vh;overflow:auto}
.box.wide{width:min(760px,100%)}
.box h3{margin:0 0 16px;font-size:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid2 .f input,.grid2 .f select,.grid2 .f textarea{width:100%}
.hint{font-size:12px;color:var(--mute);min-height:16px}
.hint.bad{color:var(--bad)}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:rgba(124,58,237,.18);color:var(--roxo-light);border:1px solid rgba(124,58,237,.4);border-radius:99px;padding:3px 4px 3px 10px;font-size:12px;display:inline-flex;align-items:center;gap:2px}
.chip button{border:0;background:none;cursor:pointer;color:var(--roxo-light);font-size:14px;line-height:1;padding:0 4px}
.urgchk{display:flex!important;align-items:center;gap:10px;text-transform:none!important;letter-spacing:0!important;font-size:14px!important;color:var(--ink)!important;cursor:pointer;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.4);border-radius:8px;padding:10px 12px}
.grid2 .f .urgchk input,.f .urgchk input{width:18px!important;height:18px;flex:0 0 18px;padding:0;margin:0;accent-color:var(--bad);cursor:pointer;box-shadow:none}
input[type=file]{padding:7px;cursor:pointer}
input[type=file]::file-selector-button{font:600 12px 'Inter',sans-serif;background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 10px;margin-right:10px;cursor:pointer}
#askLabel{margin-bottom:10px;color:var(--ink)}
#askLabel ul{padding-left:18px;margin:8px 0}
#askText,#askInput,#askWho{width:100%}
#askWhoWrap{margin-bottom:12px}
/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);color:var(--ink);padding:11px 18px;border-radius:10px;z-index:80;display:none;max-width:90%;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.ok{border-color:rgba(16,185,129,.5);color:var(--ok)}.toast.bad{border-color:rgba(239,68,68,.5);color:var(--bad)}
.toast.urg{background:#3B0D12;border-color:var(--bad);color:#fff;font-weight:600}
.toast.info{background:#0F2E2B;border-color:var(--teal);color:#fff;font-weight:600}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
@media(max-width:640px){header{padding:10px 16px}main{padding:16px 16px 120px}.info,.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <span class="brand">Central de Chamados Operacionais</span>
  <span class="env" id="env"></span>
  <div class="tabs" id="tabs"></div>
</header>

<main>
  <div class="sub-tabs" id="subTabs" style="display:none">
    <button data-sub="recebidos">Recebidos <span class="cnt" id="cntRec"></span></button>
    <button data-sub="abertos">Abertos pelo SAC <span class="cnt" id="cntAb"></span></button>
  </div>

  <div class="bar">
    <div class="f" style="flex:1;min-width:220px"><label>Busca</label><input id="fBusca" placeholder="Protocolo, cliente, CPF/CNPJ, código, NF, pedido, telefone"></div>
    <div class="f"><label>Solicitante</label><select id="fSol"></select></div>
    <div class="f" id="fSetorWrap"><label>Setor</label><select id="fSetor"></select></div>
    <div class="f"><label>Status</label><select id="fStatus"></select></div>
    <div class="f"><label>Tipo</label><select id="fTipo"></select></div>
    <div class="f"><label>De</label><input type="date" id="fDe"></div>
    <div class="f"><label>Até</label><input type="date" id="fAte"></div>
    <div class="f"><label>SLA</label><select id="fSla">
      <option value="">Todos</option><option value="noprazo">🟢 No prazo</option><option value="vencendo">🟡 Vencendo</option><option value="atrasado">🔴 Atrasado</option><option value="pausado">⏸ Pausado</option><option value="fim_ok">✔ Encerrado no prazo</option><option value="fim_fora">✖ Encerrado fora do prazo</option><option value="nao_pertence">Não pertence ao setor</option>
    </select></div>
    <div class="f"><label>Urgência</label><select id="fUrg"><option value="">Todos</option><option value="sim">Somente urgentes</option></select></div>
    <div class="f"><label>Ordenar</label><select id="fOrdem"><option value="urgencia">Mais urgentes</option><option value="recentes">Mais recentes</option></select></div>
    <button class="btn" id="btnLimpar">Limpar</button>
    <div class="spacer"></div>
    <button class="btn" id="btnCsv">⬇ Baixar CSV</button>
    <button class="btn pri" id="btnNovo">+ Novo chamado</button>
  </div>

  <div class="count" id="count"></div>
  <div class="tablewrap">
    <table>
      <thead><tr><th>Protocolo / Abertura</th><th>Solicitante</th><th>Setor</th><th>Cliente</th><th>CPF / CNPJ</th><th>Código</th><th>NFs / Pedido</th><th>Tipo</th><th>Status</th><th>SLA</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <button class="btn more" id="more" style="display:none">Carregar mais</button>
</main>

<div class="overlay" id="ov"></div>
<aside class="drawer" id="drawer">
  <div class="dh"><div id="dTitle"></div><button class="x" id="dClose" title="Fechar">×</button></div>
  <div class="db" id="dBody"></div>
  <div class="composer" id="composer">
    <select id="msgWho" title="Seu nome"></select>
    <textarea id="msg" placeholder="Escreva aqui as informações para o outro lado (Ctrl+Enter envia)"></textarea>
    <button class="btn clip" id="btnAnexo" title="Anexar arquivo (PDF ou imagem, até 10 MB)">📎</button>
    <input type="file" id="fileIn" multiple accept=".pdf,image/png,image/jpeg,image/webp" hidden>
    <button class="btn pri" id="btnMsg">Enviar</button>
  </div>
</aside>

<!-- Novo chamado -->
<div class="modal" id="novoModal">
  <div class="box wide">
    <h3>Novo chamado</h3>
    <div class="grid2">
      <div class="f"><label>Seu nome (quem está abrindo) *</label><select id="nWho"></select></div>
      <div class="f"><label>Setor de destino *</label><select id="nSetor"></select></div>
      <div class="f"><label>Tipo de demanda *</label><select id="nTipo"></select></div>
      <div class="f" id="nPedWrap" style="display:none"><label>Nº do pedido</label><input id="nPed"></div>
      <div class="f full" id="nUrgWrap" style="display:none"><label class="urgchk"><input type="checkbox" id="nUrg"><span>Marcar como <b>URGENTE</b></span></label><div class="hint" id="nUrgHint"></div></div>
      <div class="f"><label>Cliente</label><input id="nNome"></div>
      <div class="f"><label>Telefone</label><input id="nTel" inputmode="numeric"></div>
      <div class="f"><label>CPF / CNPJ</label><input id="nDoc" inputmode="numeric"><div class="hint" id="nDocHint"></div></div>
      <div class="f"><label>Código do cliente</label><input id="nCod"></div>
      <div class="f full"><label>Notas fiscais</label><input id="nNf" placeholder="Digite e tecle Enter"><div class="chips" id="nfChips"></div></div>
      <div class="f full"><label>Observação</label><textarea id="nObs"></textarea><div class="hint" id="nObsHint"></div></div>
      <div class="f full"><label>Anexos (PDF ou imagem, até 10 MB cada)</label><input type="file" id="nFiles" multiple accept=".pdf,image/png,image/jpeg,image/webp"></div>
    </div>
    <div class="foot"><button class="btn" id="nCancel">Cancelar</button><button class="btn pri" id="nSalvar">Abrir chamado</button></div>
  </div>
</div>

<!-- Transferir / redirecionar -->
<div class="modal" id="trModal">
  <div class="box">
    <h3 id="trTitle">Transferir chamado</h3>
    <div class="sub" id="trSub" style="margin-bottom:14px"></div>
    <div class="f" style="margin-bottom:12px"><label>Seu nome *</label><select id="trWho"></select></div>
    <div class="f" style="margin-bottom:12px"><label>Setor de destino *</label><select id="trSetor"></select></div>
    <div class="f" style="margin-bottom:12px"><label>Tipo de demanda *</label><select id="trTipo"></select></div>
    <div class="f" id="trPedWrap" style="margin-bottom:12px;display:none"><label>Nº do pedido</label><input id="trPed"></div>
    <div class="f" id="trUrgWrap" style="display:none"><label class="urgchk"><input type="checkbox" id="trUrg"><span>Marcar como <b>URGENTE</b></span></label><div class="hint" id="trUrgHint"></div></div>
    <div class="foot"><button class="btn" id="trCancel">Voltar</button><button class="btn pri" id="trOk">Transferir</button></div>
  </div>
</div>

<!-- CSV -->
<div class="modal" id="csvModal">
  <div class="box">
    <h3>Baixar CSV</h3>
    <div class="sub" id="csvSub"></div>
    <div class="grid2" style="margin-top:8px">
      <div class="f"><label>De</label><input type="date" id="csvDe"></div>
      <div class="f"><label>Até</label><input type="date" id="csvAte"></div>
    </div>
    <div class="foot"><button class="btn" id="csvCancel">Voltar</button><button class="btn pri" id="csvOk">Baixar</button></div>
  </div>
</div>

<!-- Modal genérico -->
<div class="modal" id="askModal">
  <div class="box">
    <h3 id="askTitle"></h3>
    <div class="f" id="askWhoWrap"><label>Seu nome *</label><select id="askWho"></select></div>
    <div id="askLabel"></div>
    <textarea id="askText"></textarea>
    <input id="askInput">
    <div class="foot"><button class="btn" id="askCancel">Voltar</button><button class="btn pri" id="askOk">Confirmar</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>



<script>
// ============ CONFIGURAÇÃO ============

const BRT = 3 * 3600e3, DIA = 86400e3, H = 3600e3;
function fmtDT(v){
  if(!v) return '';
  return new Date(v).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).replace(',','');
}
function bizMs(a, b){
  if(!(b > a)) return 0;
  let s = a - BRT; const e = b - BRT; let tot = 0;
  while(s < e){
    const fim = Math.min((Math.floor(s / DIA) + 1) * DIA, e);
    const dow = new Date(s).getUTCDay();
    if(dow !== 0 && dow !== 6) tot += fim - s;
    s = fim;
  }
  return tot;
}
function addBiz(a, ms){
  let s = a - BRT;
  while(ms > 0){
    const fimDia = (Math.floor(s / DIA) + 1) * DIA, dow = new Date(s).getUTCDay();
    if(dow === 0 || dow === 6){ s = fimDia; continue; }
    const d = Math.min(fimDia - s, ms); s += d; ms -= d;
  }
  return s + BRT;
}
function fmtDur(sec){
  sec = Math.max(0, Math.round(sec));
  if(sec < 3600) return Math.max(1, Math.round(sec / 60)) + 'min';
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60);
  if(h >= 48) return `${Math.floor(h / 24)}d ${h % 24}h`;
  return h + 'h' + (m ? String(m).padStart(2, '0') : '');
}
const hm = s => { const [h, m] = String(s || '16:00').split(':').map(Number); return (h * 60 + (m || 0)) * 60000; };
const CORTE = hm('16:00');      // corte da empresa para urgência
// Urgente: antes do corte vence no mesmo dia; depois, no próximo dia útil (horários por tipo)
function urgDeadline(ms, tipo){
  const mesmo = hm(tipo && tipo.urg_mesmo_dia || '16:00'), seguinte = hm(tipo && tipo.urg_dia_seguinte || '12:00');
  const l = ms - BRT, dia = Math.floor(l / DIA) * DIA, dow = new Date(l).getUTCDay(), t = l - dia;
  if(dow === 0 || dow === 6) return dia + (dow === 6 ? 2 : 1) * DIA + mesmo + BRT;
  if(t < CORTE) return dia + mesmo + BRT;
  return dia + (dow === 5 ? 3 : 1) * DIA + seguinte + BRT;
}

async function fetchAll(q){
  const out = [];
  for(let from = 0; ; from += 1000){
    const { data, error } = await q().range(from, from + 999);
    if(error) throw error;
    out.push(...data);
    if(data.length < 1000) return out;
  }
}

function maskDoc(v){
  const d = dig(v).slice(0,14);
  if(d.length <= 11) return d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');
  return d.replace(/^(\d{2})(\d)/,'$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d)/,'.$1/$2').replace(/(\d{4})(\d)/,'$1-$2');
}
function maskTel(v){
  const d = dig(v).slice(0,11);
  if(!d) return '';
  if(d.length <= 2) return '(' + d;
  if(d.length <= 6) return `(${d.slice(0,2)}) ${d.slice(2)}`;
  if(d.length <= 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
  return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
}
function validCPF(c){
  if(c.length !== 11 || /^(\d)\1+$/.test(c)) return false;
  let s = 0; for(let i=0;i<9;i++) s += +c[i]*(10-i);
  let r = (s*10)%11%10; if(r !== +c[9]) return false;
  s = 0; for(let i=0;i<10;i++) s += +c[i]*(11-i);
  r = (s*10)%11%10; return r === +c[10];
}
function validCNPJ(c){
  if(c.length !== 14 || /^(\d)\1+$/.test(c)) return false;
  const calc = n => { let s=0, p=n-7; for(let i=0;i<n;i++){ s += +c[i]*p--; if(p<2) p=9; } const r = s%11; return r<2 ? 0 : 11-r; };
  return calc(12) === +c[12] && calc(13) === +c[13];
}
const docValido = d => !d || (d.length === 11 ? validCPF(d) : d.length === 14 ? validCNPJ(d) : false);

const STATUS_CLS = {'Aberto':'aberto','Em andamento':'andamento','Aguardando':'aguardando','Devolvido':'devolvido','Finalizado':'finalizado','Cancelado':'cancelado'};
function statusTxt(c){
  if(c.status === 'Aguardando') return c.solicitante_setor === 'SAC' ? 'Aguardando SAC' : 'Aguardando solicitante';
  if(c.status === 'Devolvido') return c.motivo_encerramento === 'nao_pertence' ? 'Devolvido ao SAC · não pertence' : 'Devolvido ao SAC';
  if(c.status === 'Finalizado' && c.motivo_encerramento === 'nao_pertence') return 'Finalizado · não pertence';

}
const STATUS_FILTRO = { Aguardando: 'Aguardando solicitante/SAC', Devolvido: 'Devolvido ao SAC' };

function slaInfo(c){
  const total = (c.sla_horas || 24) * 3600;
  let cons = Number(c.sla_consumido_seg || 0);
  if(CORRENDO.includes(c.status) && c.sla_desde) cons += bizMs(Date.parse(c.sla_desde), now()) / 1000;
  const r = { cons, resta: total - cons, total, vence: null };
  if(c.status === 'Cancelado') return { ...r, cat:'cancelado', cls:'sla-x', txt:'Cancelado', ord: 9 };
  if((c.status === 'Devolvido' || c.status === 'Finalizado') && c.motivo_encerramento === 'nao_pertence')
    return { ...r, cat:'nao_pertence', cls:'sla-end', txt:'Não pertence ao setor', ord: 8 };
  if(c.urgente && c.sla_vence_em) return slaUrgente(c, r);
  const resta = r.resta, pct = cons / total;
  if(c.status === 'Devolvido' || c.status === 'Finalizado')
    return resta >= 0 ? { ...r, cat:'fim_ok', cls:'sla-end', txt:`✔ no prazo (${fmtDur(cons)})`, ord: 8 }
                      : { ...r, cat:'fim_fora', cls:'sla-endbad', txt:`✖ fora do prazo (+${fmtDur(-resta)})`, ord: 8 };
  const quanto = resta >= 0 ? 'faltam ' + fmtDur(resta) : 'atrasado ' + fmtDur(-resta);
  if(c.status === 'Aguardando') return { ...r, cat:'pausado', cls:'sla-pause', txt:'⏸ pausado · ' + quanto, ord: 5 };
  if(resta > 0) r.vence = addBiz(now(), resta * 1000);
  if(pct > 1) return { ...r, cat:'atrasado', cls:'sla-late', txt: quanto, dot: true, ord: 1 };
  if(pct >= 0.8) return { ...r, cat:'vencendo', cls:'sla-warn', txt: quanto, dot: true, ord: 2 };
  return { ...r, cat:'noprazo', cls:'sla-ok', txt: quanto, dot: true, ord: 3 };
}
function slaUrgente(c, r){
  const v = Date.parse(c.sla_vence_em), ini = Date.parse(c.sla_janela_inicio || c.created_at), agora = now();
  const base = { ...r, urg: true, vence: v };
  if(c.status === 'Devolvido' || c.status === 'Finalizado'){
    const p = Date.parse(c.sla_parado_em || c.devolvido_em || c.finalizado_em || c.updated_at);
    return p <= v ? { ...base, cat:'fim_ok', cls:'sla-end', txt:'✔ no prazo', ord: 8 }
                  : { ...base, cat:'fim_fora', cls:'sla-endbad', txt:`✖ fora do prazo (+${fmtDur((p - v) / 1000)})`, ord: 8 };
  }
  if(c.status === 'Aguardando'){
    const p = Date.parse(c.sla_parado_em || iso(agora));
    return { ...base, cat:'pausado', cls:'sla-pause', ord: 5, resta: (v - p) / 1000,
             txt: '⏸ pausado · ' + (p <= v ? 'faltam ' + fmtDur((v - p) / 1000) : 'atrasado ' + fmtDur((p - v) / 1000)) };
  }
  const resta = (v - agora) / 1000, pct = (agora - ini) / Math.max(1, v - ini);
  const quanto = resta >= 0 ? 'faltam ' + fmtDur(resta) : 'atrasado ' + fmtDur(-resta);
  if(resta < 0) return { ...base, resta, cat:'atrasado', cls:'sla-late', txt: quanto, dot: true, ord: 1 };
  if(pct >= 0.8) return { ...base, resta, cat:'vencendo', cls:'sla-warn', txt: quanto, dot: true, ord: 2 };
  return { ...base, resta, cat:'noprazo', cls:'sla-ok', txt: quanto, dot: true, ord: 3 };
}

function baseLista(){
  if(S.tab === 'MEUS') return DB.chamados;
  if(S.tab === 'SAC' && S.sub === 'abertos') return DB.chamados.filter(c => c.solicitante_setor === 'SAC');
  return DB.chamados.filter(c => c.setor === S.tab);
}
function filtrar(){
  let rows = baseLista();
  const st = $('#fStatus').value, sol = $('#fSol').value, set = $('#fSetor').value, tp = $('#fTipo').value;
  if(st === 'ativos') rows = rows.filter(c => !FINAIS.includes(c.status)); else if(st) rows = rows.filter(c => c.status === st);
  if(sol) rows = rows.filter(c => c.solicitante === sol);
  if(set && $('#fSetorWrap').style.display !== 'none') rows = rows.filter(c => c.setor === set);
  if(tp) rows = rows.filter(c => c.tipo === tp);
  const de = $('#fDe').value, ate = $('#fAte').value;
  if(de) rows = rows.filter(c => Date.parse(c.created_at) >= Date.parse(de + 'T00:00:00-03:00'));
  if(ate) rows = rows.filter(c => Date.parse(c.created_at) <= Date.parse(ate + 'T23:59:59.999-03:00'));
  const q = $('#fBusca').value.trim().toLowerCase();
  if(q){
    const d = dig(q);
    rows = rows.filter(c => [c.protocolo, c.cliente_nome, c.codigo_cliente, c.pedido, (c.nfs || []).join(' ')].some(v => String(v || '').toLowerCase().includes(q))
      || (d.length >= 3 && [c.documento, c.telefone].some(v => String(v || '').includes(d))));
  }
  let lista = rows.map(r => ({ r, s: slaInfo(r) }));
  if($('#fSla').value) lista = lista.filter(x => x.s.cat === $('#fSla').value);
  if($('#fUrg').value) lista = lista.filter(x => x.r.urgente);
  const grupo = x => x.r.urgente && x.s.ord <= 5 ? 0 : 1;
  if($('#fOrdem').value === 'urgencia')
    lista.sort((a, b) => grupo(a) - grupo(b) || a.s.ord - b.s.ord || (a.s.ord <= 5 ? a.s.resta - b.s.resta : Date.parse(b.r.created_at) - Date.parse(a.r.created_at)));
  else lista.sort((a, b) => Date.parse(b.r.created_at) - Date.parse(a.r.created_at));
  return lista;
}

  fillWho($('#msgWho'), nomesChat(S.open));

// Quem pode agir do lado do solicitante: o próprio solicitante (ou qualquer pessoa do SAC, se foi o SAC que abriu)
const nomesSolicitante = c => c.solicitante_setor === 'SAC' ? nomesSetor('SAC') : [c.solicitante];
function nomesChat(c){ return ctxPapel() === 'set' ? nomesSetor(c.setor) : nomesSolicitante(c); }
const souSetor = c => ctxPapel() === 'set' && c.setor === ctxSetor();
const podeReabrir = c => c.status === 'Finalizado' && c.motivo_encerramento === 'resolvida' && c.finalizado_em
  && bizMs(Date.parse(c.finalizado_em), now()) <= 5 * 24 * H;

function acoes(c){
  const a = [];
  if(souSetor(c)){
    if(c.status === 'Aberto') a.push(['Assumir chamado','pri','assumir']);
    if(c.status === 'Em andamento'){ a.push(['Demanda resolvida','pri','resolver']); a.push(['Não pertence ao setor','','naoPertence']); a.push([c.solicitante_setor === 'SAC' ? 'Aguardando SAC' : 'Aguardando solicitante','','aguardar']); }
    if(c.status === 'Aguardando') a.push(['Retomar atendimento','pri','retomar']);
    if(c.setor === 'SAC' && ['Aberto','Em andamento','Aguardando'].includes(c.status)) a.push(['Transferir para outro setor','teal','transferir']);
    if(['Aberto','Em andamento','Aguardando'].includes(c.status)) a.push(['Cancelar chamado','danger','cancelar']);
  } else if(ctxPapel() === 'sol'){
    if(c.status === 'Aguardando') a.push(['Devolver ao setor','pri','responder']);
    if(c.status === 'Devolvido'){
      a.push(['Finalizar chamado','pri','finalizar']);
      if(c.motivo_encerramento === 'nao_pertence') a.push(['Redirecionar para outro setor','teal','redirecionar']);
      else a.push(['Devolver ao setor','','reenviar']);
    }
    if(podeReabrir(c)) a.push(['Reabrir chamado','pri','reabrir']);
    if(!FINAIS.includes(c.status)) a.push(['Cancelar chamado','danger','cancelar']);
  }
  return a;
}

function fillWho(sel, nomes, keep = false){
  const cur = keep ? sel.value : '';
  sel.innerHTML = (nomes.length === 1 ? '' : `<option value="">Seu nome…</option>`) +
    nomes.map(n => `<option value="${esc(n)}" ${n === cur ? 'selected' : ''}>${esc(nomeLabel(n, (pessoa(n) || {}).setor))}</option>`).join('');
  sel.classList.remove('invalid');
}
function pegaNome(sel){
  const v = sel.value;
  if(!v){ sel.classList.add('invalid'); sel.focus(); toast('Selecione seu nome', 'bad'); return null; }
  sel.classList.remove('invalid'); return v;

// ---------- janela de confirmação ----------
function ask({ title, label = '', required = false, field = 'text', okLabel = 'Confirmar', danger = false, nomes = null }){
  return new Promise(res => {
    const m = $('#askModal'), ta = $('#askText'), inp = $('#askInput'), ok = $('#askOk');
    $('#askTitle').textContent = title; $('#askLabel').innerHTML = label;
    ta.style.display = field === 'text' ? '' : 'none'; inp.style.display = field === 'input' ? '' : 'none';
    const el = field === 'text' ? ta : field === 'input' ? inp : null;
    if(el){ el.value = ''; el.classList.remove('invalid'); }
    ok.textContent = okLabel; ok.className = 'btn ' + (danger ? 'danger' : 'pri');
    $('#askWhoWrap').style.display = nomes ? '' : 'none';
    if(nomes) fillWho($('#askWho'), nomes);
    m.classList.add('show');
    setTimeout(() => (nomes && nomes.length > 1 ? $('#askWho') : (el || ok)).focus(), 50);
    const done = v => { m.classList.remove('show'); ok.onclick = $('#askCancel').onclick = null; res(v); };
    ok.onclick = () => {
      const v = el ? el.value.trim() : '';
      let nome = null;
      if(nomes){ nome = pegaNome($('#askWho')); if(!nome) return; }
      if(required && !v){ el.classList.add('invalid'); el.focus(); return; }
      done(nomes ? { nome, texto: v } : v);
    };
    $('#askCancel').onclick = () => done(null);
  });
}

// ---------- ações ----------
// Executa uma mudança de status com trava e registra no histórico
async function mudar(patch, esperado, texto, nome, papel, msg){
  const c = S.open;
  const { data, error } = await sb.from(T('chamados')).update(patch).eq('id', c.id).eq('status', esperado || c.status).select();
  if(error){ err(error); return false; }
  if(!data.length){ toast('Este chamado foi alterado por outra pessoa. Atualizando…', 'bad'); await recarregar(c.id); return false; }
  const regs = [];
  if(msg) regs.push(histRow(c.id, nome, papel, 'mensagem', msg));
  regs.push(histRow(c.id, nome, papel, 'status', texto));
  const r = await sb.from(T('historico')).insert(regs);
  if(r.error) err(r.error);
  await recarregar(c.id); return true;
}
const voltaAoSac = c => c.solicitante_setor === 'SAC';
const ACOES = {
  async assumir(){
    const c = S.open;
    const r = await ask({ title:'Assumir chamado', label:`Quem do ${esc(SETORES[c.setor])} está assumindo este chamado?`, field:'none', nomes: nomesSetor(c.setor), okLabel:'Assumir' });
    if(r) mudar({ status:'Em andamento', em_andamento_por: r.nome, em_andamento_em: iso(now()) }, 'Aberto', 'Chamado em andamento', r.nome, 'set');
  },
  async resolver(){
    const c = S.open, sac = voltaAoSac(c);
    const r = await ask({ title:'Demanda resolvida', label: sac ? 'O chamado volta para o SAC finalizar com o cliente. As informações ficam no chat.' : `O chamado será <b>finalizado</b> e ${esc(c.solicitante)} verá a resposta em Meus chamados.`, field:'none', nomes: nomesSetor(c.setor), okLabel: sac ? 'Devolver ao SAC' : 'Finalizar' });
    if(!r) return;
    if(sac) mudar({ status:'Devolvido', motivo_encerramento:'resolvida', devolvido_por: r.nome, devolvido_em: iso(now()) }, 'Em andamento', 'Demanda resolvida · devolvido ao SAC', r.nome, 'set');
    else mudar({ status:'Finalizado', motivo_encerramento:'resolvida', finalizado_por: r.nome, finalizado_em: iso(now()) }, 'Em andamento', 'Demanda resolvida · chamado finalizado', r.nome, 'set');
  },
  async naoPertence(){
    const c = S.open, sac = voltaAoSac(c);
    const r = await ask({ title:'Não pertence ao setor', label: sac ? 'O chamado volta para o SAC redirecionar ao setor correto.' : `O chamado será <b>finalizado</b>. ${esc(c.solicitante)} precisa abrir um novo chamado no setor correto. Explique no chat qual é o setor.`, field:'none', nomes: nomesSetor(c.setor), okLabel: sac ? 'Devolver ao SAC' : 'Encerrar' });
    if(!r) return;
    if(sac) mudar({ status:'Devolvido', motivo_encerramento:'nao_pertence', devolvido_por: r.nome, devolvido_em: iso(now()) }, 'Em andamento', 'Não pertence ao setor · devolvido ao SAC', r.nome, 'set');
    else mudar({ status:'Finalizado', motivo_encerramento:'nao_pertence', finalizado_por: r.nome, finalizado_em: iso(now()) }, 'Em andamento', 'Não pertence ao setor · chamado finalizado', r.nome, 'set');
  },
  async aguardar(){
    const c = S.open, quem = voltaAoSac(c) ? 'SAC' : 'solicitante';
    const r = await ask({ title:`Aguardando ${quem}`, label:`A pergunta vai para o ${quem} e o SLA fica pausado até a resposta.`, field:'none', nomes: nomesSetor(c.setor), okLabel:'Confirmar' });
    if(r) mudar({ status:'Aguardando' }, 'Em andamento', `Aguardando ${quem}`, r.nome, 'set');
  },
  async retomar(){
    const c = S.open;
    const r = await ask({ title:'Retomar atendimento', field:'none', nomes: nomesSetor(c.setor), okLabel:'Retomar' });
    if(r) mudar({ status:'Em andamento' }, 'Aguardando', 'Atendimento retomado', r.nome, 'set');
  },
  async responder(){
    const c = S.open;
    const r = await ask({ title:'Devolver ao setor', label:`O chamado volta para o ${esc(SETORES[c.setor])} e o SLA continua de onde parou.`, field:'none', nomes: nomesSolicitante(c), okLabel:'Devolver ao setor' });
    if(r) mudar({ status:'Em andamento' }, 'Aguardando', 'Devolvido ao setor com resposta do solicitante', r.nome, 'sol');
  },
  async reenviar(){
    const c = S.open;
    const r = await ask({ title:'Devolver ao setor', label:`O chamado volta para o ${esc(SETORES[c.setor])}. Explique no chat o que ainda falta.`, field:'none', nomes: nomesSolicitante(c), okLabel:'Devolver ao setor' });
    if(r) mudar({ status:'Em andamento', motivo_encerramento: null }, 'Devolvido', 'Devolvido ao setor pelo SAC', r.nome, 'sol');
  },
  async finalizar(){
    const c = S.open;
    const r = await ask({ title:'Finalizar chamado', label:'Confirma que a devolutiva foi enviada ao cliente ou a quem pediu?', field:'none', nomes: nomesSolicitante(c), okLabel:'Finalizar' });
    if(r) mudar({ status:'Finalizado', finalizado_por: r.nome, finalizado_em: iso(now()) }, 'Devolvido', 'Chamado finalizado', r.nome, 'sol');
  },
  async reabrir(){
    const c = S.open;
    const r = await ask({ title:'Reabrir chamado', label:`O chamado volta para o ${esc(SETORES[c.setor])} e o SLA continua de onde parou. Por que está reabrindo?`, required:true, nomes: nomesSolicitante(c), okLabel:'Reabrir' });
    if(!r) return;
    mudar({ status:'Em andamento', motivo_encerramento: null, finalizado_por: null, finalizado_em: null, reaberturas: (c.reaberturas || 0) + 1 }, 'Finalizado', `Chamado reaberto (${(c.reaberturas || 0) + 1}ª vez)`, r.nome, 'sol', 'Motivo da reabertura: ' + r.texto);
  },
  async cancelar(){
    const c = S.open, set = souSetor(c);
    const r = await ask({ title:'Cancelar chamado', label:'Motivo do cancelamento (obrigatório):', required:true, nomes: set ? nomesSetor(c.setor) : nomesSolicitante(c), okLabel:'Cancelar chamado', danger:true });
    if(r) mudar({ status:'Cancelado', cancelado_por: r.nome, cancelado_em: iso(now()), motivo_cancelamento: r.texto }, c.status, 'Chamado cancelado', r.nome, set ? 'set' : 'sol');
  },
  transferir(){ abrirTransferencia('transferir'); },
  redirecionar(){ abrirTransferencia('redirecionar'); }
};

// ---------- transferir (SAC) ----------
let TR = null;
function opcoesTipo(sel, setor, atual = ''){
  const tipos = DB.tipos.filter(t => t.setor === setor).map(t => t.tipo).sort((a, b) => a === 'Outros assuntos' ? 1 : b === 'Outros assuntos' ? -1 : a.localeCompare(b, 'pt-BR'));
  sel.innerHTML = `<option value="">${setor ? 'Selecione…' : 'Escolha o setor primeiro'}</option>` + tipos.map(t => `<option ${t === atual ? 'selected' : ''}>${esc(t)}</option>`).join('');
  sel.disabled = !setor;
}
function abrirTransferencia(modo){
  const c = S.open; TR = { modo };
  $('#trTitle').textContent = modo === 'transferir' ? 'Transferir chamado' : 'Redirecionar chamado';
  $('#trSub').textContent = modo === 'transferir'
    ? `O chamado vai para outro setor. O SLA do novo tipo conta desde a abertura (${fmtDT(c.created_at)}), e a resposta final vai direto para ${c.solicitante}.`
    : `O chamado vai para o setor correto. O SLA do novo tipo conta desde a abertura (${fmtDT(c.created_at)}).`;
  fillWho($('#trWho'), nomesSetor('SAC'));
  const destinos = SET_KEYS.filter(k => k !== 'SAC' && k !== c.setor);
  $('#trSetor').innerHTML = `<option value="">Selecione…</option>` + destinos.map(k => `<option value="${k}">${esc(SETORES[k])}</option>`).join('');
  opcoesTipo($('#trTipo'), ''); $('#trPed').value = c.pedido || ''; $('#trUrg').checked = false;
  atualizaTr(); $('#trModal').classList.add('show');
}
function atualizaTr(){
  const setor = $('#trSetor').value, tp = tipoDe(setor, $('#trTipo').value);
  $('#trPedWrap').style.display = setor === 'FAT' ? '' : 'none';
  const pode = !!(tp && tp.permite_urgente);
  $('#trUrgWrap').style.display = pode ? '' : 'none'; if(!pode) $('#trUrg').checked = false;
  if($('#trUrg').checked){
    const v = urgDeadline(Date.parse(S.open.created_at), tp);
    $('#trUrgHint').innerHTML = `Prazo contado da abertura: até ${fmtDT(v)}${v < now() ? ' · <b style="color:#FCA5A5">já nasce atrasado</b>' : ''}`;
  } else $('#trUrgHint').textContent = '';
}
$('#trSetor').onchange = () => { opcoesTipo($('#trTipo'), $('#trSetor').value); atualizaTr(); };
$('#trTipo').onchange = $('#trUrg').onchange = atualizaTr;
$('#trCancel').onclick = () => $('#trModal').classList.remove('show');
$('#trOk').onclick = async () => {
  const nome = pegaNome($('#trWho')); if(!nome) return;
  const setor = $('#trSetor').value, tipo = $('#trTipo').value;
  if(!setor){ $('#trSetor').classList.add('invalid'); return; }
  if(!tipo){ $('#trTipo').classList.add('invalid'); return; }
  const c = S.open, tp = tipoDe(setor, tipo), de = c.setor, urg = !!($('#trUrg').checked && tp && tp.permite_urgente);
  // o banco recalcula o SLA e o prazo de urgência do novo tipo, contados desde a abertura
  const patch = { setor, tipo, status: 'Aberto', urgente: urg, motivo_encerramento: null,
    em_andamento_por: null, em_andamento_em: null, devolvido_por: null, devolvido_em: null,
    transferido_de: de, transferido_por: nome, transferido_em: iso(now()) };
  if(setor === 'FAT') patch.pedido = $('#trPed').value.trim() || c.pedido || null;
  $('#trOk').disabled = true;
  const { data, error } = await sb.from(T('chamados')).update(patch).eq('id', c.id).eq('status', c.status).select();
  $('#trOk').disabled = false;
  if(error) return err(error);
  if(!data.length){ toast('Este chamado foi alterado por outra pessoa.', 'bad'); return recarregar(c.id); }
  await hist(c.id, nome, 'sol', 'status', `${TR.modo === 'transferir' ? 'Transferido' : 'Redirecionado'} de ${SETORES[de]} para ${SETORES[setor]} · ${tipo}${data[0].urgente ? ' · URGENTE' : ''}`);
  $('#trModal').classList.remove('show');
  toast(`Chamado enviado para ${SETORES[setor]}`, 'ok');
  if(TR.modo === 'transferir') closeDrawer();
  await recarregar(c.id);
};

$('#msg').onkeydown = e => { if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)) enviarMsg(); };

// ---------- anexos ----------
const fmtSize = b => b < 1048576 ? Math.max(1, Math.round(b/1024)) + ' KB' : (b/1048576).toFixed(1).replace('.', ',') + ' MB';
function validaArquivos(files){
  for(const f of files){
    if(f.size > MAX_MB * 1048576){ toast(`${f.name}: acima de ${MAX_MB} MB`, 'bad'); return false; }
    if(!TIPOS_ARQ.includes(f.type)){ toast(`${f.name}: envie PDF ou imagem (PNG, JPG, WEBP)`, 'bad'); return false; }
  }
  return true;
}
const safeName = n => n.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w.\-]+/g, '_').slice(-120);
async function subirAnexos(chamadoId, files, nome, papel){
  let ok = 0;
  for(const f of files){
    const caminho = `${PASTA}/${chamadoId}/${Date.now()}_${safeName(f.name)}`;
    const up = await sb.storage.from(BUCKET).upload(caminho, f, { contentType: f.type, upsert: false });
    if(up.error){ err(up.error); continue; }
    const r = await sb.from(T('anexos')).insert({ chamado_id: chamadoId, autor: nome, papel, nome_arquivo: f.name, caminho, tamanho: f.size, tipo_mime: f.type });
    if(r.error){ err(r.error); continue; }
    await hist(chamadoId, nome, papel, 'status', `Anexou: ${f.name}`);
    ok++;
  }
  return ok;
}
async function baixarAnexo(id){
  const a = S.anexos.find(x => x.id === id); if(!a) return;
  const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(a.caminho, 60, { download: a.nome_arquivo });
  if(error) return err(error);
  const l = document.createElement('a'); l.href = data.signedUrl; l.target = '_blank'; l.rel = 'noopener';
  document.body.appendChild(l); l.click(); l.remove();
}
$('#btnAnexo').onclick = () => { if(pegaNome($('#msgWho'))) $('#fileIn').click(); };
$('#fileIn').onchange = async e => {
  const files = [...e.target.files]; e.target.value = '';
  if(!files.length || !S.open) return;
  const n = pegaNome($('#msgWho')); if(!n || !validaArquivos(files)) return;
  $('#btnAnexo').disabled = true; toast('Enviando anexo…');
  const ok = await subirAnexos(S.open.id, files, n, ctxPapel());
  $('#btnAnexo').disabled = false;
  if(ok) toast(`${ok} arquivo(s) anexado(s)`, 'ok');
  await recarregar(S.open.id);
};

// ---------- novo chamado ----------
const NF = { list: [] };
function renderNf(){ $('#nfChips').innerHTML = NF.list.map((v,i) => `<span class="chip">${esc(v)}<button data-rm="${i}" title="Remover">×</button></span>`).join(''); }
function addNfFromInput(){
  $('#nNf').value.split(/[,;\s]+/).map(s => s.replace(/[^\w.\-\/]/g,'')).filter(Boolean).forEach(v => { if(!NF.list.includes(v)) NF.list.push(v); });
  $('#nNf').value = ''; renderNf();
}
$('#nNf').onkeydown = e => { if(e.key === 'Enter' || e.key === ','){ e.preventDefault(); addNfFromInput(); } };
$('#nNf').onblur = addNfFromInput;
$('#nfChips').onclick = e => { const b = e.target.closest('[data-rm]'); if(b){ NF.list.splice(+b.dataset.rm, 1); renderNf(); } };
$('#nTel').oninput = e => e.target.value = maskTel(e.target.value);
$('#nDoc').oninput = e => { e.target.value = maskDoc(e.target.value); $('#nDocHint').textContent=''; $('#nDocHint').className='hint'; e.target.classList.remove('invalid'); };
$('#nDoc').onblur = () => { const d = dig($('#nDoc').value); if(d && !docValido(d)){ $('#nDocHint').textContent = 'CPF/CNPJ inválido'; $('#nDocHint').className = 'hint bad'; $('#nDoc').classList.add('invalid'); } };

function atualizaNovo(){
  const quem = pessoa($('#nWho').value), setor = $('#nSetor').value;
  // pode abrir para qualquer setor, menos o seu
  const destinos = SET_KEYS.filter(k => !quem || k !== quem.setor);
  $('#nSetor').innerHTML = `<option value="">Selecione…</option>` + destinos.map(k => `<option value="${k}" ${k === setor ? 'selected' : ''}>${esc(SETORES[k])}</option>`).join('');
  const s2 = $('#nSetor').value;
  if(s2 !== $('#nTipo').dataset.setor){ opcoesTipo($('#nTipo'), s2); $('#nTipo').dataset.setor = s2; }
  $('#nPedWrap').style.display = s2 === 'FAT' ? '' : 'none';
  const tp = tipoDe(s2, $('#nTipo').value), pode = !!(tp && tp.permite_urgente);
  $('#nUrgWrap').style.display = pode ? '' : 'none'; if(!pode) $('#nUrg').checked = false;
  $('#nUrgHint').textContent = $('#nUrg').checked ? `Prazo do ${SETORES[s2]}: até ${fmtDT(urgDeadline(now(), tp))}` : '';
  $('#nObsHint').textContent = $('#nTipo').value === 'Outros assuntos' ? 'Obrigatória para Outros assuntos' : '';
}
['#nWho','#nSetor','#nTipo','#nUrg'].forEach(s => $(s).onchange = atualizaNovo);
function abrirNovo(){
  const doSac = S.tab === 'SAC';
  const nomes = doSac ? nomesSetor('SAC') : [...DB.pessoas].filter(p => p.ativo).map(p => p.nome).sort((a, b) => a.localeCompare(b, 'pt-BR'));
  fillWho($('#nWho'), nomes);
  const lembrado = ls.get('cco_meu_nome');
  if(lembrado && nomes.includes(lembrado)) $('#nWho').value = lembrado;
  ['#nNome','#nTel','#nDoc','#nCod','#nNf','#nObs','#nPed'].forEach(s => { $(s).value=''; $(s).classList.remove('invalid'); });
  $('#nSetor').innerHTML = ''; $('#nTipo').dataset.setor = '-'; $('#nUrg').checked = false; $('#nFiles').value = '';
  $('#nDocHint').textContent = ''; NF.list = []; renderNf(); atualizaNovo();
  $('#novoModal').classList.add('show');
}
$('#btnNovo').onclick = abrirNovo;
$('#nCancel').onclick = () => $('#novoModal').classList.remove('show');
function buscarDuplicados(doc, nfs){
  return DB.chamados.filter(c => !FINAIS.includes(c.status) && ((doc && c.documento === doc) || (nfs.length && (c.nfs || []).some(n => nfs.includes(n)))));
}
$('#nSalvar').onclick = async () => {
  const n = pegaNome($('#nWho')); if(!n) return;
  addNfFromInput();
  const setor = $('#nSetor').value, tipo = $('#nTipo').value;
  if(!setor){ $('#nSetor').classList.add('invalid'); toast('Escolha o setor de destino', 'bad'); return; }
  if(!tipo){ $('#nTipo').classList.add('invalid'); toast('Escolha o tipo de demanda', 'bad'); return; }
  const doc = dig($('#nDoc').value), obs = $('#nObs').value.trim();
  if(doc && !docValido(doc)){ $('#nDoc').classList.add('invalid'); $('#nDocHint').textContent='CPF/CNPJ inválido'; $('#nDocHint').className='hint bad'; $('#nDoc').focus(); return; }
  if(tipo === 'Outros assuntos' && !obs){ $('#nObs').classList.add('invalid'); $('#nObsHint').className='hint bad'; $('#nObs').focus(); return; }
  const arquivos = [...$('#nFiles').files];
  if(arquivos.length && !validaArquivos(arquivos)) return;
  const dups = buscarDuplicados(doc, NF.list);
  if(dups.length){
    $('#novoModal').classList.remove('show');
    const ok = await ask({ title:'Possível duplicidade', field:'none', okLabel:'Abrir mesmo assim',
      label:`Já existe chamado ativo para este CPF/CNPJ ou NF:<ul>${dups.map(d => `<li><b>${esc(d.protocolo)}</b> · ${esc(SETORES[d.setor])} · ${esc(d.tipo)} · ${esc(statusTxt(d))}</li>`).join('')}</ul>Deseja abrir um novo mesmo assim?` });
    if(ok === null){ $('#novoModal').classList.add('show'); return; }
  }
  const btn = $('#nSalvar'); btn.disabled = true;
  const { data: c, error } = await sb.from(T('chamados')).insert({ solicitante: n, aberto_por: n, setor, tipo, urgente: $('#nUrg').checked,
    cliente_nome: $('#nNome').value.trim() || null, telefone: dig($('#nTel').value) || null, documento: doc || null,
    codigo_cliente: $('#nCod').value.trim() || null, nfs: NF.list, pedido: setor === 'FAT' ? ($('#nPed').value.trim() || null) : null, observacao: obs || null }).select().single();
  btn.disabled = false;
  if(error){ $('#novoModal').classList.add('show'); return err(error); }
  await hist(c.id, n, 'sol', 'status', c.urgente ? 'Chamado aberto como URGENTE' : 'Chamado aberto');
  if(arquivos.length){ toast('Enviando anexos…'); await subirAnexos(c.id, arquivos, n, 'sol'); }
  await recarregar();
  if(S.tab === 'MEUS'){ ls.set('cco_meu_nome', n); renderFiltros(); }
  $('#novoModal').classList.remove('show');
  toast(`Chamado ${c.protocolo} aberto para ${SETORES[setor]}`, 'ok');
  openDetail(c.id);
};

// ---------- CSV ----------
$('#btnCsv').onclick = () => {
  $('#csvSub').textContent = (S.tab === 'MEUS' ? 'Todos os chamados' : S.tab === 'SAC' && S.sub === 'abertos' ? 'Chamados abertos pelo SAC' : 'Chamados do ' + SETORES[S.tab]) + '. Deixe as datas em branco para baixar tudo; a data é a de abertura.';
  $('#csvModal').classList.add('show');
};
$('#csvCancel').onclick = () => $('#csvModal').classList.remove('show');
const csvCell = v => { if(v === null || v === undefined) return ''; const s = String(v); return /[";\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const horasBR = sec => (Math.round(sec / 360) / 10).toFixed(1).replace('.', ',');
$('#csvOk').onclick = () => {
  const de = $('#csvDe').value, ate = $('#csvAte').value;
  if(de && ate && de > ate){ toast('A data inicial é maior que a final', 'bad'); return; }
  let rows = baseLista();
  if(de) rows = rows.filter(c => Date.parse(c.created_at) >= Date.parse(de + 'T00:00:00-03:00'));
  if(ate) rows = rows.filter(c => Date.parse(c.created_at) <= Date.parse(ate + 'T23:59:59.999-03:00'));
  if(!rows.length){ toast('Nenhum chamado no período', 'bad'); return; }
  rows = [...rows].sort((a, b) => Date.parse(a.created_at) - Date.parse(b.created_at));
  const cab = ['Protocolo','Abertura','Solicitante','Setor do solicitante','Setor atual','Transferido de','Tipo','Urgente','Prazo urgente','Cliente','CPF/CNPJ','Código','NFs','Nº pedido','Observação','Status','Motivo do encerramento','Assumido por','Assumido em','Devolvido em','Devolvido por','Finalizado em','Finalizado por','Cancelado em','Cancelado por','Motivo do cancelamento','Reaberturas','SLA (h)','Tempo consumido (h)','Situação do SLA'];
  const linhas = rows.map(c => { const s = slaInfo(c); return [c.protocolo, fmtDT(c.created_at), c.solicitante, c.solicitante_setor ? SETORES[c.solicitante_setor] : '', SETORES[c.setor], c.transferido_de ? SETORES[c.transferido_de] : '', c.tipo, c.urgente ? 'Sim' : 'Não', c.urgente ? fmtDT(c.sla_vence_em) : '',
    c.cliente_nome, maskDoc(c.documento), c.codigo_cliente, (c.nfs || []).join(', '), c.pedido, c.observacao, statusTxt(c),
    c.motivo_encerramento === 'nao_pertence' ? 'Não pertence ao setor' : c.motivo_encerramento === 'resolvida' ? 'Demanda resolvida' : '',
    c.em_andamento_por, fmtDT(c.em_andamento_em), fmtDT(c.devolvido_em), c.devolvido_por, fmtDT(c.finalizado_em), c.finalizado_por, fmtDT(c.cancelado_em), c.cancelado_por, c.motivo_cancelamento,
    c.reaberturas || 0, c.urgente ? '' : c.sla_horas, horasBR(s.cons), SLA_NOME[s.cat]].map(csvCell).join(';'); });
  const csv = '﻿' + [cab.join(';'), ...linhas].join('\r\n');
  const nome = S.tab === 'MEUS' ? 'todos' : S.tab === 'SAC' && S.sub === 'abertos' ? 'abertos_pelo_sac' : SETORES[S.tab].toLowerCase().replace(/[^a-z]+/g, '_');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `chamados_${nome}${de || ate ? `_${de || 'inicio'}_a_${ate || 'hoje'}` : ''}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  $('#csvModal').classList.remove('show'); toast(`${rows.length} chamados exportados`, 'ok');
};

// ---------- copiar ----------
document.addEventListener('click', e => {
  const b = e.target.closest('[data-copy]'); if(!b) return;
  e.stopPropagation();
  const v = b.dataset.copy;
  (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).then(() => toast('Copiado: ' + v, 'ok')).catch(() => toast('Copiado: ' + v, 'ok'));
}, true);

// ---------- atualização automática (tempo real) ----------
let rtT, rtIds = new Set(), rtMsgs = [];
function onRt(tabela, p){
  const row = p.new && Object.keys(p.new).length ? p.new : (p.old || {});
  const id = tabela === 'chamados' ? row.id : row.chamado_id;
  if(id) rtIds.add(id);
  if(tabela === 'historico' && p.eventType === 'INSERT' && row.tipo === 'mensagem' && papelDe(row) === 'set') rtMsgs.push(row);
  clearTimeout(rtT);
  rtT = setTimeout(async () => {
    const ids = rtIds, msgs = rtMsgs; rtIds = new Set(); rtMsgs = [];
    const antes = DB.chamados.map(c => ({ ...c }));
    try { await carregarChamados(); } catch(e){ return err(e); }
    avisos(antes, DB.chamados, msgs);
    if(S.open && $('#drawer').classList.contains('show') && ids.has(S.open.id)){ S.open = DB.chamados.find(c => c.id === S.open.id) || S.open; await carregarDetalhe(S.open.id); }
    render();
  }, 700);
}
function avisos(antes, depois, msgs){
  const setor = ctxSetor(), meu = S.tab === 'MEUS' ? $('#fSol').value : '';
  depois.forEach(c => {
    const old = antes.find(x => x.id === c.id);
    if(!old){
      if(setor && ctxPapel() === 'set' && c.setor === setor) toast(`Novo chamado${c.urgente ? ' URGENTE' : ''}: ${c.protocolo}`, c.urgente ? 'urg' : 'info', 8000);
      return;
    }
    if(old.setor !== c.setor && setor && ctxPapel() === 'set' && c.setor === setor) toast(`Chamado transferido para você: ${c.protocolo}`, c.urgente ? 'urg' : 'info', 8000);
    if(meu && c.solicitante === meu && old.status !== c.status && ['Aguardando','Finalizado','Devolvido'].includes(c.status))
      toast(`Seu chamado ${c.protocolo}: ${statusTxt(c)}`, 'info', 8000);
  });
  if(meu) msgs.forEach(m => { const c = depois.find(x => x.id === m.chamado_id); if(c && c.solicitante === meu) toast(`Nova resposta no seu chamado ${c.protocolo}`, 'info', 8000); });
}
function iniciaTempoReal(){
  try {
    const ch = sb.channel('cco-rt-' + (CONFIG.PREFIX || 'prod'));
    ['chamados','historico','anexos'].forEach(t => ch.on('postgres_changes', { event: '*', schema: 'public', table: T(t) }, p => onRt(t, p)));
    ch.subscribe(st => { S.rt = st === 'SUBSCRIBED'; });
  } catch(e){ console.error(e); S.rt = false; }
}
// sem conexão em tempo real: atualiza a cada minuto; com conexão, só refaz o semáforo
setInterval(() => { if(!S.rt) recarregar(S.open && S.open.id); else render(); }, 60000);

document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  if($('#askModal').classList.contains('show')) $('#askCancel').click();
  else if($('#trModal').classList.contains('show')) $('#trModal').classList.remove('show');
  else if($('#csvModal').classList.contains('show')) $('#csvModal').classList.remove('show');
  else if($('#novoModal').classList.contains('show')) $('#novoModal').classList.remove('show');
  else if($('#drawer').classList.contains('show')) closeDrawer();
});

// ---------- início ----------
(async function init(){
  $('#env').textContent = CONFIG.AMBIENTE; $('#env').style.display = CONFIG.AMBIENTE ? '' : 'none';
  if(!['MEUS', ...SET_KEYS].includes(S.tab)) S.tab = 'MEUS';
  $('#rows').innerHTML = `<tr><td colspan="10" class="empty">Carregando…</td></tr>`;
  try { await carregarBase(); await carregarChamados(); }
  catch(e){ err(e); $('#rows').innerHTML = `<tr><td colspan="10" class="empty">Não foi possível carregar os chamados</td></tr>`; return; }
  renderFiltros(); render(); iniciaTempoReal();
})();
</script>
